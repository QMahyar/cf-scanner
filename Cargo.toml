[package]
name = "cf-scanner"
version = "0.1.0"
edition = "2024"
description = "Find working Cloudflare IPs/endpoints on ISP-restricted networks"
license = "MIT"
repository = "https://github.com/qmahyar/cf-scanner"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6"
percent-encoding = "2.3.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "0.26"
