[package]
name = "cf-scanner"
version = "0.13.0"
edition = "2024"
description = "Find working Cloudflare IPs/endpoints on ISP-restricted networks"
license = "MIT"
authors = ["qmahyar"]
repository = "https://github.com/qmahyar/cf-scanner"
rust-version = "1.88"

[package.metadata.wix]
upgrade-guid = "B4B16BC8-2905-4E0E-A024-47552733A782"
path-guid = "77D27897-3FD7-4F5E-8E8D-752186082D10"
license = true
eula = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
boringtun = "0.7.1"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6"
maxminddb = "0.30"
percent-encoding = "2.3.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "signal", "fs"] }
tokio-rustls = "0.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "0.26"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
proptest = "1"
rcgen = "0.13"

[features]
dist-bundle-xray = []
test-helpers = []

[build-dependencies]
flate2 = "1"
sha2 = "0.11.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
collapsible_if = "allow"
