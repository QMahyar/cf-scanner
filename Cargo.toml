[package]
name = "cf-scanner"
version = "0.12.2"
edition = "2024"
description = "Find working Cloudflare IPs/endpoints on ISP-restricted networks"
license = "MIT"
authors = ["qmahyar"]
repository = "https://github.com/qmahyar/cf-scanner"
rust-version = "1.88"

[package.metadata.wix]
upgrade-guid = "B4B16BC8-2905-4E0E-A024-47552733A782"
path-guid = "77D27897-3FD7-4F5E-8E8D-752186082D10"
# Renders the license sidecar component into wix/main.wxs (cargo-wix writes
# wix/LICENSE.rtf from the MIT template); required for MSI to be self-contained
# per review Domain 5. `eula` stays false so no EULA dialog is shown.
license = true
eula = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
boringtun = "0.7.1"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6"
maxminddb = "0.30"
percent-encoding = "2.3.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "signal"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1.3"
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "0.26"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Windows system tray + HKCU autostart; absent from non-Windows builds so the
# tray stub never drags GTK/appindicator into Linux/macOS builds. default-features
# off: tray-icon's defaults (libxdo/gtk) are Linux-only extras we never need.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
winreg = "0.56"

[dev-dependencies]
proptest = "1"
rcgen = "0.13"

[features]
# dist-only: build.rs bundles the checksum-verified xray binary into release
# archives (see dist-workspace.toml). Dev builds never enable this.
dist-bundle-xray = []

[build-dependencies]
flate2 = "1"
sha2 = "0.11.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Review Domain 4: keep dev `cargo build --release` on par with dist builds
# (release artifacts are produced with LTO + single codegen unit).
[profile.release]
lto = "thin"
codegen-units = 1
