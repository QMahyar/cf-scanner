name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: test + clippy + fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Doc tests
        run: cargo test --doc --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check all features (dist-bundle-xray parity on main)
        run: cargo check --all-features --locked
      - name: Format
        run: cargo fmt --check

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Measure coverage + gate
        run: cargo llvm-cov --all-targets --doc --locked --lcov --output-path lcov.info --fail-under-lines 70
      - uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info

  ui:
    name: ui (check + test + build + dist drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ui
      - name: Check
        run: npm run check
        working-directory: ui
      - name: Test
        run: npm test
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Check dist drift
        # Fails when ui/src changed without a rebuild; run `cd ui && npm run build`
        # and commit ui/dist together with ui/src (see docs/development.md).
        run: git diff --exit-code ui/dist

  ui-a11y:
    name: ui a11y (axe, desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: A11y gate
        run: npm run a11y
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-screens
          path: ui/a11y-screens

  placeholder-guard:
    name: no tracked file > 1MB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on oversized tracked files
        shell: bash
        run: |
          oversized=$(
            git ls-files -z \
              | xargs -0 -r stat --printf='%s\t%n\n' -- 2>/dev/null \
              | awk -F'\t' '$1 > 1048576 {print $2 " (" $1 " bytes)"}'
          )
          if [ -n "$oversized" ]; then
            echo "::error::tracked files exceed 1MB — a bundled binary (xray, mmdb) was probably committed:"
            echo "$oversized"
            echo "restore the 0-byte placeholders with: git restore data/bundled/xray data/bundled/xray.exe"
            exit 1
          fi

  xray-parity:
    name: xray pin parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert pinned tag + bundle/probe parity
        shell: bash
        run: |
          tag=$(cat data/xray-version.txt)
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::data/xray-version.txt is not a vX.Y.Z tag: '$tag'"
              exit 1
              ;;
          esac
          grep -q 'xray-version.txt' src/xray.rs || {
            echo "::error::xray probe (src/xray.rs) no longer reads data/xray-version.txt"
            exit 1
          }
          grep -q 'xray-version.txt' build.rs || {
            echo "::error::xray bundle step (build.rs) no longer reads data/xray-version.txt"
            exit 1
          }
          # The release bundle downloads XRAY_BASE/<tag>/Xray-*.zip; a pinned
          # tag XTLS never published fails every release build, so fail fast
          # on PRs instead of at tag-push.
          code=$(curl -fsSL --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "https://github.com/XTLS/Xray-core/releases/tag/$tag" 2>/dev/null || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::XTLS release for $tag not found (HTTP $code); release bundling would fail"
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: Audit dependencies
        run: cargo audit

  version-parity:
    name: version parity (Cargo.toml == npm == RELEASE_TAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check version parity
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver=$(grep -E '^\s*version\s*=' Cargo.toml | head -n1 | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
          npm_ver=$(grep -E '"version"\s*:' npm/cf-scanner/package.json | head -n1 | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')
          tag_ver=$(grep -E 'RELEASE_TAG\s*=' npm/cf-scanner/install.js | head -n1 | sed -E 's/.*RELEASE_TAG\s*=\s*"v([^"]+)".*/\1/')
          echo "Cargo.toml: $cargo_ver"
          echo "npm/cf-scanner/package.json: $npm_ver"
          echo "npm/cf-scanner/install.js RELEASE_TAG: v$tag_ver"
          if [ "$cargo_ver" != "$npm_ver" ]; then
            echo "::error::version mismatch: Cargo.toml ($cargo_ver) != npm/cf-scanner/package.json ($npm_ver)"
            exit 1
          fi
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "::error::version mismatch: Cargo.toml ($cargo_ver) != RELEASE_TAG (v$tag_ver)"
            exit 1
          fi
          echo "Version parity OK: $cargo_ver"
