[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["msi", "powershell", "shell"]
allow-dirty = ["msi", "ci"]
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

include = ["data/bundled"]

features = ["dist-bundle-xray"]
