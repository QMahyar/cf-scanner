[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi", "powershell", "shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Archives carry the per-platform xray binary next to cf-scanner itself:
# build.rs overwrites the committed placeholder with the checksum-verified
# download whenever the `dist-bundle-xray` feature is on (dist builds only),
# so the same include list works on every target.
# NOTE: dist-workspace.toml is parsed as the flat v0 schema — no nested
# [dist.artifacts.archives] / [dist.builds.cargo] tables (they're ignored).
include = ["data/bundled/xray", "data/bundled/xray.exe"]

# Enable the release-bundling feature only for dist builds; dev builds stay
# untouched (runtime fallback download covers them, per spec).
features = ["dist-bundle-xray"]
